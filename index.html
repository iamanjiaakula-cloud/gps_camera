<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GPS Geo Camera</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --bar-bg: rgba(0,0,0,0.65);
    --accent: #2dd4bf;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; background:#000; color:#fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden; overscroll-behavior: none;
  }
  /* position:fixed + dvh keeps this pinned to the browser's *visible* area on
     mobile, so nothing (like the download button) ends up hidden behind the
     address bar or home-indicator area. Inset by 1cm on every side, leaving a
     blank border (the plain black body shows through) around the whole app. */
  #app {
    position: fixed;
    top: 1cm; left: 1cm;
    width: calc(100vw - 2cm);
    height: calc(100vh - 2cm);
    height: calc(100dvh - 2cm);
    height: calc(var(--app-height, 100dvh) - 2cm);
    overflow: hidden;
  }

  /* The viewfinder is centered inside #app and, when a ratio other than
     "Full" is picked, is constrained to that aspect ratio (portrait-style,
     since that's how the phone is normally held) so the live preview matches
     what the saved photo will actually be cropped to. */
  #viewfinder {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 100%; height: 100%;
    overflow: hidden; background:#000;
  }
  #viewfinder[data-ratio="1:1"] { aspect-ratio: 1 / 1; width: auto; max-width: 100%; }
  #viewfinder[data-ratio="4:3"] { aspect-ratio: 3 / 4; width: auto; max-width: 100%; }
  #viewfinder[data-ratio="16:9"] { aspect-ratio: 9 / 16; width: auto; max-width: 100%; }

  #video, #canvas {
    position: absolute; top:0; left:0; width:100%; height:100%;
    object-fit: cover;
  }
  #video { background:#111; }
  #canvas { display:none; }

  #topBar {
    position: absolute; top:0; left:0; right:0;
    padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    background: linear-gradient(rgba(0,0,0,0.55), transparent);
    font-size: 14px; z-index: 5;
    pointer-events:none;
    display:flex; align-items:center; gap:8px;
  }
  #ratioBtn {
    pointer-events: auto;
    background: rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.5); color:#fff;
    border-radius: 14px; padding: 5px 12px; font-size:13px; cursor:pointer;
  }

  #controls {
    position:absolute; left:0; right:0; bottom: max(24px, env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:center; gap:40px;
    z-index: 5;
  }
  #captureBtn {
    width:72px; height:72px; border-radius:50%; border:4px solid #fff;
    background: rgba(255,255,255,0.15); cursor:pointer;
  }
  #captureBtn:active { background: rgba(255,255,255,0.4); }
  #captureBtn:disabled { opacity: 0.4; }
  #switchBtn, #retakeBtn, #downloadBtn {
    background: rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.5);
    color:#fff; border-radius: 10px; padding: 10px 16px; font-size:15px;
    cursor:pointer; text-decoration:none; display:inline-block;
  }
  #switchBtn { width:52px; height:52px; border-radius:50%; font-size:22px; padding:0; }

  /* Result screen: a fixed 3-row layout (photo / map / buttons). Each row has
     a defined size so the whole thing always fits the viewport — no
     scrolling required, and the download button is always on screen. */
  #resultView {
    position: absolute; top:0; left:0; width:100%; height:100%;
    display:none; flex-direction: column; background:#000;
    z-index: 10;
  }
  #resultView.active { display:flex; }
  #resultImageWrap {
    flex: 1 1 auto; min-height: 0;
    display:flex; align-items:center; justify-content:center;
    background:#000; overflow:hidden;
  }
  #resultImage { max-width:100%; max-height:100%; object-fit:contain; display:block; }
  #mapPreview { flex: 0 0 100px; width:100%; height:100px; background:#222; }
  #resultControls {
    flex: 0 0 auto;
    display:flex; gap:16px; justify-content:center;
    padding: 12px 16px max(12px, env(safe-area-inset-bottom));
  }

  #statusText { flex: 1; text-align: center; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="app">

  <div id="viewfinder" data-ratio="full">
    <video id="video" autoplay playsinline muted></video>
  </div>
  <canvas id="canvas"></canvas>

  <div id="topBar">
    <span id="statusText">Starting camera…</span>
    <button id="ratioBtn" title="Aspect ratio">Full</button>
  </div>

  <div id="controls">
    <button id="switchBtn" title="Switch camera">🔄</button>
    <button id="captureBtn" title="Capture" disabled></button>
    <div style="width:52px"></div>
  </div>

  <div id="resultView">
    <div id="resultImageWrap"><img id="resultImage" alt="Captured geo-tagged photo" /></div>
    <div id="mapPreview"></div>
    <div id="resultControls">
      <button id="retakeBtn">Retake</button>
      <a id="downloadBtn" download="geo_photo.jpg">Download</a>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  const video = document.getElementById('video');
  const viewfinder = document.getElementById('viewfinder');
  const canvas = document.getElementById('canvas');
  const statusText = document.getElementById('statusText');
  const captureBtn = document.getElementById('captureBtn');
  const switchBtn = document.getElementById('switchBtn');
  const ratioBtn = document.getElementById('ratioBtn');
  const resultView = document.getElementById('resultView');
  const resultImage = document.getElementById('resultImage');
  const retakeBtn = document.getElementById('retakeBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const mapPreviewEl = document.getElementById('mapPreview');

  // Aspect-ratio options, expressed as portrait width:height (since that's how
  // the phone is normally held) — "Full" uses whatever the camera sensor
  // natively delivers, uncropped. Cycling this both reshapes the live
  // viewfinder and crops the actual saved photo to match.
  const RATIOS = [
    { key: 'full', label: 'Full', ratio: null },
    { key: '1:1', label: '1:1', ratio: 1 },
    { key: '4:3', label: '4:3', ratio: 3 / 4 },
    { key: '16:9', label: '16:9', ratio: 9 / 16 }
  ];
  let ratioIndex = 0;

  ratioBtn.addEventListener('click', () => {
    ratioIndex = (ratioIndex + 1) % RATIOS.length;
    const r = RATIOS[ratioIndex];
    ratioBtn.textContent = r.label;
    viewfinder.dataset.ratio = r.key;
  });

  // Given the camera's native frame size, returns the centered crop rectangle
  // matching the chosen ratio (or the whole frame, uncropped, for "Full").
  function computeCropRect(w, h, ratio) {
    if (!ratio) return { x: 0, y: 0, w, h };
    const current = w / h;
    let cw, ch;
    if (current > ratio) { ch = h; cw = Math.round(h * ratio); }
    else { cw = w; ch = Math.round(w / ratio); }
    return { x: Math.round((w - cw) / 2), y: Math.round((h - ch) / 2), w: cw, h: ch };
  }

  // Some mobile browsers (older MIUI/Xiaomi WebViews included) don't support the
  // "dvh" unit reliably, and 100vh alone often includes space hidden behind the
  // address bar. Measuring the real visible height in JS and feeding it into a
  // CSS variable is the dependable cross-browser fix — this is what actually
  // keeps the download button on screen without needing to scroll.
  function setAppHeight() {
    const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', () => setTimeout(setAppHeight, 250));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);

  let currentStream = null;
  let facingMode = 'environment'; // fallback only, used until we have a labeled device list
  let videoDevices = [];
  let currentDeviceIndex = -1; // -1 = haven't switched to deviceId-based selection yet
  let leafletMap = null;
  let leafletMarker = null;

  async function refreshVideoDevices() {
    try {
      const list = await navigator.mediaDevices.enumerateDevices();
      videoDevices = list.filter(d => d.kind === 'videoinput');
    } catch (e) { /* leave videoDevices as-is */ }
  }

  // ---------- Camera handling ----------
  // Some phones (Xiaomi/MIUI devices among them) report facingMode metadata
  // unreliably, which can make a "front camera" request silently return a
  // stream that never produces frames (a blank/black video). Selecting by the
  // camera's actual deviceId — once we know it from enumerateDevices — sidesteps
  // that entirely. We fall back to facingMode only before we have that list.
  // Waits for the video element to actually be producing frames (nonzero
  // dimensions). Guards the exact crash that happens if the shutter is tapped
  // (or capture runs) before the stream is truly ready — most likely right
  // after opening the camera or right after switching.
  function waitForVideoReady(timeoutMs = 5000) {
    return new Promise((resolve, reject) => {
      if (video.videoWidth > 0 && video.videoHeight > 0) { resolve(); return; }
      const start = Date.now();
      const check = () => {
        if (video.videoWidth > 0 && video.videoHeight > 0) { resolve(); return; }
        if (Date.now() - start > timeoutMs) { reject(new Error('Camera is still starting up — please wait a moment and try again')); return; }
        requestAnimationFrame(check);
      };
      check();
    });
  }

  async function startCamera() {
    stopCamera();
    captureBtn.disabled = true;
    await new Promise(r => setTimeout(r, 250)); // let the camera hardware fully release first

    const attempts = [];
    const dev = currentDeviceIndex >= 0 ? videoDevices[currentDeviceIndex] : null;
    if (dev) {
      attempts.push({ video: { deviceId: { exact: dev.deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    }
    attempts.push({ video: { facingMode: { exact: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    attempts.push({ video: { facingMode }, audio: false });
    attempts.push({ video: true, audio: false });

    let lastErr = null;
    for (const constraints of attempts) {
      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        try { await video.play(); } catch (e) { /* autoplay attr usually handles this anyway */ }
        if (!videoDevices.length || !videoDevices[0].label) await refreshVideoDevices(); // labels need permission first
        try {
          await waitForVideoReady();
          captureBtn.disabled = false;
          statusText.textContent = 'Ready — tap the shutter to capture';
        } catch (readyErr) {
          statusText.textContent = readyErr.message;
        }
        return;
      } catch (err) {
        lastErr = err;
      }
    }
    statusText.textContent = 'Camera access denied or unavailable: ' + (lastErr ? lastErr.message : '');
  }

  function stopCamera() {
    captureBtn.disabled = true;
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
      currentStream = null;
    }
    video.srcObject = null; // fully detach so the next getUserMedia call isn't fighting the old stream
  }

  switchBtn.addEventListener('click', () => {
    if (videoDevices.length > 1) {
      currentDeviceIndex = currentDeviceIndex < 0 ? 1 % videoDevices.length : (currentDeviceIndex + 1) % videoDevices.length;
    } else {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
    }
    startCamera();
  });

  // ---------- Geolocation ----------
  function getLocation() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(new Error('Geolocation not supported by this browser'));
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => resolve(pos.coords),
        err => reject(err),
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );
    });
  }

  // Converts a 2-letter ISO country code (e.g. "IN") into its flag emoji.
  function countryCodeToFlag(cc) {
    if (!cc || cc.length !== 2) return '';
    return cc.toUpperCase().replace(/./g, ch => String.fromCodePoint(127397 + ch.charCodeAt(0)));
  }

  // Computes a 10-digit Open Location Code / "Plus Code" (e.g. "7JCXC4HJ+PW")
  // straight from lat/lon — this is a published, patent-free, offline
  // algorithm (no network call, no API key), so it can't fail or time out.
  // Verified against Google's own documented example
  // (51.3701125, -1.217765625 -> "9C3W9QCJ+2V") before wiring it in.
  function toPlusCode(lat, lon) {
    const ALPHABET = '23456789CFGHJMPQRVWX';
    const RESOLUTIONS = [20, 1, 0.05, 0.0025, 0.000125]; // degrees, per digit pair
    let clat = Math.max(-90, Math.min(90, lat));
    if (clat === 90) clat -= RESOLUTIONS[RESOLUTIONS.length - 1];
    const clon = ((lon + 180) % 360 + 360) % 360 - 180;

    let latVal = clat + 90;   // 0..180
    let lonVal = clon + 180;  // 0..360
    let code = '';
    for (let i = 0; i < RESOLUTIONS.length; i++) {
      const res = RESOLUTIONS[i];
      const latDigit = Math.floor(latVal / res + 1e-9); // epsilon guards float rounding at digit boundaries
      latVal -= latDigit * res;
      const lonDigit = Math.floor(lonVal / res + 1e-9);
      lonVal -= lonDigit * res;
      code += ALPHABET[latDigit] + ALPHABET[lonDigit];
      if (i === 3) code += '+';
    }
    return code;
  }

  // Reverse-geocode via OpenStreetMap Nominatim (free, rate-limited — fine for personal use).
  // Returns a short bold "header" (city, state, country) and a fuller "detail" address line,
  // similar to how commercial GPS-camera apps split the address into two lines. The detail
  // line is assembled from structured fields (house number first, when OSM has it tagged)
  // rather than Nominatim's raw display_name, which occasionally includes odd/garbled
  // tokens for a location and doesn't let us control field order.
  async function reverseGeocode(lat, lon) {
    try {
      const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`;
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) throw new Error('Lookup failed');
      const data = await res.json();
      const a = data.address || {};
      const city = a.city || a.town || a.village || a.suburb || a.county || '';
      const header = [city, a.state, a.country].filter(Boolean).join(', ') || 'Unknown location';
      const flag = countryCodeToFlag(a.country_code);
      const detailParts = [
        a.house_number, a.road, a.suburb || a.neighbourhood,
        city, a.state_district, a.state, a.postcode, a.country
      ].filter(Boolean);
      // House number only appears if OSM has it tagged for that spot — many
      // areas (a lot of residential India included) simply aren't mapped down
      // to that level of detail yet, so it won't always be there.
      const detail = detailParts.length ? detailParts.join(', ') : (data.display_name || 'Address unavailable');
      return { header, detail, flag };
    } catch (e) {
      return { header: 'Unknown location', detail: 'Address unavailable', flag: '' };
    }
  }

  function haversineMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  // Finds the nearest named place/landmark within ~200m using the Overpass API
  // (free, OpenStreetMap data) — this is the "nearby" reference line, separate
  // from the exact reverse-geocoded address, similar to how map-camera apps
  // show a landmark for extra context. Returns null if nothing nearby is named
  // or the lookup fails/times out, in which case that line is simply omitted.
  async function findNearbyPlace(lat, lon) {
    try {
      const query = `[out:json][timeout:8];(node(around:200,${lat},${lon})["name"];way(around:200,${lat},${lon})["name"];);out center 10;`;
      const res = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: query });
      if (!res.ok) throw new Error('Overpass failed');
      const data = await res.json();
      let best = null, bestDist = Infinity;
      for (const el of data.elements || []) {
        const elat = el.lat ?? (el.center && el.center.lat);
        const elon = el.lon ?? (el.center && el.center.lon);
        if (elat == null || elon == null || !el.tags || !el.tags.name) continue;
        const d = haversineMeters(lat, lon, elat, elon);
        if (d < bestDist) { bestDist = d; best = el.tags.name; }
      }
      return best ? { name: best, distance: Math.round(bestDist) } : null;
    } catch (e) {
      return null;
    }
  }

  // ---------- Drawing the geotag overlay onto the captured photo ----------
  function wrapText(ctx, text, maxWidth) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const word of words) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  // Converts lat/lon to fractional slippy-map tile coordinates at a given zoom.
  function lonLatToTileFloat(lat, lon, zoom) {
    const n = Math.pow(2, zoom);
    const x = (lon + 180) / 360 * n;
    const latRad = lat * Math.PI / 180;
    const y = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
    return { x, y, n };
  }

  function withTimeout(promise, ms) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error('timeout')), ms);
      promise.then(v => { clearTimeout(timer); resolve(v); },
                   e => { clearTimeout(timer); reject(e); });
    });
  }

  function loadImage(url, timeoutMs) {
    return withTimeout(new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('tile failed to load'));
      img.src = url;
    }), timeoutMs);
  }

  // Draws a clear red map pin (circle head + point + drop shadow) centered
  // in a size x size square. Used on both the real map and the fallback map,
  // so a pin always looks the same regardless of which one is used.
  function drawPin(ctx, size) {
    const cx = size / 2;
    const headCy = size * 0.38;
    const headR = size * 0.16;
    const tipY = size * 0.72;

    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(cx, tipY + size * 0.03, size * 0.09, size * 0.03, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ea4335';
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = Math.max(1, size * 0.008);
    ctx.beginPath();
    ctx.arc(cx, headCy, headR, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx - headR * 0.75, headCy + headR * 0.6);
    ctx.lineTo(cx + headR * 0.75, headCy + headR * 0.6);
    ctx.lineTo(cx, tipY);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(cx, headCy, headR * 0.42, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // A simple, always-available stylized "map" (pale background, a couple of
  // road lines, a soft water/park block) so there's still a map-like image
  // with a pin even when real map tiles can't be fetched (offline, blocked,
  // slow connection, etc).
  function createStylizedMapCanvas(size) {
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const ctx = c.getContext('2d');

    ctx.fillStyle = '#eef1e6';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#cfe3ec';
    ctx.fillRect(0, size * 0.62, size * 0.4, size * 0.38);
    ctx.fillStyle = '#d9ead0';
    ctx.fillRect(size * 0.68, 0, size * 0.32, size * 0.35);

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = Math.max(2, size * 0.02);
    [0.3, 0.62].forEach(f => { ctx.beginPath(); ctx.moveTo(0, size * f); ctx.lineTo(size, size * f); ctx.stroke(); });
    [0.35, 0.7].forEach(f => { ctx.beginPath(); ctx.moveTo(size * f, 0); ctx.lineTo(size * f, size); ctx.stroke(); });

    drawPin(ctx, size);
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, size - 2, size - 2);
    return c;
  }

  // Fetches the OpenStreetMap tiles needed to cover a size x size window
  // centered on lat/lon. Rejects (rather than leaving gaps) if any tile
  // fails or times out, so the caller can cleanly fall back instead of
  // showing a half-broken grid.
  async function buildRealTileCanvas(lat, lon, size, zoom) {
    const { x: xtileF, y: ytileF, n } = lonLatToTileFloat(lat, lon, zoom);
    const centerPxX = xtileF * 256;
    const centerPxY = ytileF * 256;
    const minPxX = centerPxX - size / 2;
    const minPxY = centerPxY - size / 2;
    const minTileX = Math.floor(minPxX / 256);
    const maxTileX = Math.floor((centerPxX + size / 2) / 256);
    const minTileY = Math.floor(minPxY / 256);
    const maxTileY = Math.floor((centerPxY + size / 2) / 256);

    const gridCanvas = document.createElement('canvas');
    gridCanvas.width = (maxTileX - minTileX + 1) * 256;
    gridCanvas.height = (maxTileY - minTileY + 1) * 256;
    const gctx = gridCanvas.getContext('2d');

    const loads = [];
    for (let tx = minTileX; tx <= maxTileX; tx++) {
      for (let ty = minTileY; ty <= maxTileY; ty++) {
        const wrappedX = ((tx % n) + n) % n;
        const url = `https://tile.openstreetmap.org/${zoom}/${wrappedX}/${ty}.png`;
        loads.push(loadImage(url, 3000).then(img => {
          gctx.drawImage(img, (tx - minTileX) * 256, (ty - minTileY) * 256);
        }));
      }
    }
    await Promise.all(loads);

    const outCanvas = document.createElement('canvas');
    outCanvas.width = size; outCanvas.height = size;
    const octx = outCanvas.getContext('2d');
    // Warms up OpenStreetMap's default grey/teal palette to read closer to the
    // cream-and-blue look of commercial map apps. This is a render-time filter
    // only (no pixel reads), so it can't trigger the CORS "tainted canvas"
    // issue that a real Google Maps image would (confirmed that would break
    // the download feature entirely — see note below).
    if ('filter' in octx) octx.filter = 'saturate(1.35) hue-rotate(-6deg) brightness(1.04)';
    octx.drawImage(
      gridCanvas,
      minPxX - minTileX * 256, minPxY - minTileY * 256, size, size,
      0, 0, size, size
    );
    octx.filter = 'none';
    return outCanvas;
  }

  // Builds the map thumbnail baked into the photo. Tries real OpenStreetMap
  // tiles first; if that fails or is too slow, falls back to the stylized
  // map above — either way this always resolves with a valid canvas that
  // already has the pin drawn on it, so the photo never ends up without one.
  async function buildMapThumbnail(lat, lon, size, zoom = 16) {
    try {
      const real = await withTimeout(buildRealTileCanvas(lat, lon, size, zoom), 5000);
      const ctx = real.getContext('2d');
      drawPin(ctx, size);
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = Math.max(2, size * 0.012);
      ctx.strokeRect(1, 1, size - 2, size - 2);
      return real;
    } catch (e) {
      return createStylizedMapCanvas(size);
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function formatTimestamp(d) {
    const dayName = d.toLocaleDateString(undefined, { weekday: 'long' });
    const dateStr = d.toLocaleDateString(undefined, { day: '2-digit', month: '2-digit', year: 'numeric' });
    const timeStr = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: true });
    const offsetMin = -d.getTimezoneOffset();
    const sign = offsetMin >= 0 ? '+' : '-';
    const abs = Math.abs(offsetMin);
    const hh = String(Math.floor(abs / 60)).padStart(2, '0');
    const mm = String(abs % 60).padStart(2, '0');
    return `${dayName}, ${dateStr} ${timeStr} GMT ${sign}${hh}:${mm}`;
  }

  function drawOverlay(ctx, w, h, { header, detail, flag, plusCode, nearby, lat, lon, accuracy, timestamp, mapThumb, thumbSize }) {
    const pad = Math.round(w * 0.03);
    const textAreaWidth = w - pad * 2 - thumbSize - pad;

    const headerFontSize = Math.round(w * 0.038);
    const bodyFontSize = Math.round(w * 0.026);
    const lineHeight = Math.round(bodyFontSize * 1.5);
    const headerLineHeight = Math.round(headerFontSize * 1.4);

    ctx.font = `${bodyFontSize}px sans-serif`;
    const detailLines = wrapText(ctx, detail, textAreaWidth).slice(0, 3);
    const nearLines = nearby ? wrapText(ctx, `Near: ${nearby.name} (~${nearby.distance}m)`, textAreaWidth).slice(0, 1) : [];
    const infoLines = [
      `Lat ${lat.toFixed(6)}°  Long ${lon.toFixed(6)}°  (±${Math.round(accuracy)}m)`,
      timestamp
    ];

    const bodyLineCount = 1 /* plus code */ + detailLines.length + nearLines.length + infoLines.length;
    const textBlockHeight = headerLineHeight + bodyLineCount * lineHeight;
    const barHeight = Math.max(pad * 2 + textBlockHeight, thumbSize + pad * 2);

    // semi-transparent bar
    ctx.fillStyle = 'rgba(0,0,0,0.62)';
    ctx.fillRect(0, h - barHeight, w, barHeight);

    // map thumbnail, bottom-left (always present — see buildMapThumbnail)
    const thumbY = h - barHeight + (barHeight - thumbSize) / 2;
    ctx.drawImage(mapThumb, pad, thumbY, thumbSize, thumbSize);

    // small app badge just above the bar, right-aligned
    const badgeText = '📍 GPS Geo Camera';
    ctx.font = `${Math.round(w * 0.024)}px sans-serif`;
    const badgePadX = Math.round(w * 0.015);
    const badgeW = ctx.measureText(badgeText).width + badgePadX * 2;
    const badgeH = Math.round(w * 0.038);
    const badgeX = w - pad - badgeW;
    const badgeY = h - barHeight - badgeH - Math.round(w * 0.01);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    roundRect(ctx, badgeX, badgeY, badgeW, badgeH, badgeH / 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.textBaseline = 'middle';
    ctx.fillText(badgeText, badgeX + badgePadX, badgeY + badgeH / 2);

    // text content, to the right of the thumbnail
    const tx = pad + thumbSize + pad;
    let ty = h - barHeight + pad;

    ctx.textBaseline = 'top';
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${headerFontSize}px sans-serif`;
    ctx.fillText(`${header} ${flag}`.trim(), tx, ty);
    ty += headerLineHeight;

    ctx.font = `${bodyFontSize}px sans-serif`;
    ctx.fillStyle = '#9fd6ff';
    ctx.fillText(plusCode, tx, ty);
    ty += lineHeight;

    ctx.fillStyle = '#e2e2e2';
    for (const l of detailLines) { ctx.fillText(l, tx, ty); ty += lineHeight; }

    if (nearLines.length) {
      ctx.fillStyle = '#9fd6ff';
      for (const l of nearLines) { ctx.fillText(l, tx, ty); ty += lineHeight; }
    }

    ctx.fillStyle = '#ffffff';
    for (const l of infoLines) { ctx.fillText(l, tx, ty); ty += lineHeight; }
  }

  // ---------- Capture flow ----------
  captureBtn.addEventListener('click', async () => {
    captureBtn.disabled = true;
    try {
      if (video.videoWidth === 0 || video.videoHeight === 0) {
        await waitForVideoReady(); // extra safety net even if this somehow fired before the button was enabled
      }
      statusText.textContent = 'Getting your location…';
      const coords = await getLocation();
      const { latitude: lat, longitude: lon, accuracy } = coords;

      statusText.textContent = 'Looking up address & building map…';
      const nativeW = video.videoWidth;
      const nativeH = video.videoHeight;
      const crop = computeCropRect(nativeW, nativeH, RATIOS[ratioIndex].ratio);
      const w = crop.w;
      const h = crop.h;
      const thumbSize = Math.round(w * 0.17);
      const plusCode = toPlusCode(lat, lon); // computed instantly, offline — no network wait

      const [address, mapThumb, nearby] = await Promise.all([
        reverseGeocode(lat, lon),
        buildMapThumbnail(lat, lon, thumbSize), // always resolves — real tiles, or a stylized fallback with a pin
        withTimeout(findNearbyPlace(lat, lon), 6000).catch(() => null)
      ]);

      // draw the video frame, cropped to the chosen aspect ratio
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, crop.x, crop.y, crop.w, crop.h, 0, 0, w, h);

      const timestamp = formatTimestamp(new Date());
      drawOverlay(ctx, w, h, {
        header: address.header, detail: address.detail, flag: address.flag, plusCode, nearby,
        lat, lon, accuracy, timestamp, mapThumb, thumbSize
      });

      const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
      resultImage.src = dataUrl;
      downloadBtn.href = dataUrl;
      downloadBtn.download = `geo_photo_${Date.now()}.jpg`;

      showResult(lat, lon);
    } catch (err) {
      statusText.textContent = 'Could not capture: ' + (err.message || err);
    } finally {
      captureBtn.disabled = false;
    }
  });

  function showResult(lat, lon) {
    resultView.classList.add('active');
    stopCamera();

    // live map preview (for on-screen reference only — not baked into the saved image)
    setTimeout(() => {
      if (!leafletMap) {
        leafletMap = L.map(mapPreviewEl).setView([lat, lon], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors',
          maxZoom: 19
        }).addTo(leafletMap);
        leafletMarker = L.marker([lat, lon]).addTo(leafletMap);
      } else {
        leafletMap.setView([lat, lon], 16);
        leafletMarker.setLatLng([lat, lon]);
      }
      leafletMap.invalidateSize();
    }, 50);
  }

  retakeBtn.addEventListener('click', () => {
    resultView.classList.remove('active');
    statusText.textContent = 'Starting camera…';
    startCamera();
  });

  // ---------- Init ----------
  startCamera();
})();
</script>
</body>
  </html>
