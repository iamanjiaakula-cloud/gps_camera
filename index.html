<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GPS Geo Camera</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --bar-bg: rgba(0,0,0,0.65);
    --accent: #2dd4bf;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; background:#000; color:#fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #app { position: relative; width: 100vw; height: 100vh; }

  #video, #resultView, #canvas {
    position: absolute; top:0; left:0; width:100%; height:100%;
    object-fit: cover;
  }
  #video { background:#111; }
  #canvas { display:none; }

  #topBar {
    position: absolute; top:0; left:0; right:0;
    padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    background: linear-gradient(rgba(0,0,0,0.55), transparent);
    font-size: 14px; text-align:center; z-index: 5;
    pointer-events:none;
  }

  #controls {
    position:absolute; left:0; right:0; bottom: max(24px, env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:center; gap:40px;
    z-index: 5;
  }
  #captureBtn {
    width:72px; height:72px; border-radius:50%; border:4px solid #fff;
    background: rgba(255,255,255,0.15); cursor:pointer;
  }
  #captureBtn:active { background: rgba(255,255,255,0.4); }
  #switchBtn, #retakeBtn, #downloadBtn {
    background: rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.5);
    color:#fff; border-radius: 10px; padding: 10px 16px; font-size:15px;
    cursor:pointer; text-decoration:none; display:inline-block;
  }
  #switchBtn { width:52px; height:52px; border-radius:50%; font-size:22px; padding:0; }

  #resultView {
    display:none; flex-direction: column; background:#000; overflow-y:auto;
    z-index: 10;
  }
  #resultView.active { display:flex; }
  #resultImage { width:100%; display:block; }
  #mapPreview { width:100%; height: 180px; background:#222; }
  #resultControls {
    display:flex; gap:16px; justify-content:center; padding: 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
  }

  #statusText { display:block; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="app">

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="topBar"><span id="statusText">Starting camera…</span></div>

  <div id="controls">
    <button id="switchBtn" title="Switch camera">🔄</button>
    <button id="captureBtn" title="Capture"></button>
    <div style="width:52px"></div>
  </div>

  <div id="resultView">
    <img id="resultImage" alt="Captured geo-tagged photo" />
    <div id="mapPreview"></div>
    <div id="resultControls">
      <button id="retakeBtn">Retake</button>
      <a id="downloadBtn" download="geo_photo.jpg">Download</a>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const statusText = document.getElementById('statusText');
  const captureBtn = document.getElementById('captureBtn');
  const switchBtn = document.getElementById('switchBtn');
  const resultView = document.getElementById('resultView');
  const resultImage = document.getElementById('resultImage');
  const retakeBtn = document.getElementById('retakeBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const mapPreviewEl = document.getElementById('mapPreview');

  let currentStream = null;
  let facingMode = 'environment'; // back camera by default
  let leafletMap = null;
  let leafletMarker = null;

  // ---------- Camera handling ----------
  async function startCamera() {
    stopCamera();
    try {
      currentStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facingMode } },
        audio: false
      });
      video.srcObject = currentStream;
      statusText.textContent = 'Ready — tap the shutter to capture';
    } catch (err) {
      statusText.textContent = 'Camera access denied or unavailable: ' + err.message;
    }
  }

  function stopCamera() {
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
      currentStream = null;
    }
  }

  switchBtn.addEventListener('click', () => {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    startCamera();
  });

  // ---------- Geolocation ----------
  function getLocation() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(new Error('Geolocation not supported by this browser'));
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => resolve(pos.coords),
        err => reject(err),
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );
    });
  }

  // Reverse-geocode via OpenStreetMap Nominatim (free, rate-limited — fine for personal use).
  async function reverseGeocode(lat, lon) {
    try {
      const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`;
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) throw new Error('Lookup failed');
      const data = await res.json();
      return data.display_name || 'Address unavailable';
    } catch (e) {
      return 'Address unavailable';
    }
  }

  // ---------- Drawing the geotag overlay onto the captured photo ----------
  function wrapText(ctx, text, maxWidth) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const word of words) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  function drawOverlay(ctx, w, h, { address, lat, lon, accuracy, timestamp }) {
    const pad = Math.round(w * 0.03);
    ctx.font = `${Math.round(w * 0.032)}px sans-serif`;
    const addressLines = wrapText(ctx, address, w - pad * 2 - w * 0.10);
    const lineHeight = Math.round(w * 0.045);
    const infoLines = [
      `Lat: ${lat.toFixed(6)}, Lon: ${lon.toFixed(6)} (±${Math.round(accuracy)}m)`,
      timestamp
    ];
    const totalLines = addressLines.length + infoLines.length;
    const barHeight = pad * 2 + totalLines * lineHeight;

    // semi-transparent bar
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, h - barHeight, w, barHeight);

    // simple location pin icon
    const pinX = pad + w * 0.02;
    const pinY = h - barHeight + pad + w * 0.02;
    ctx.fillStyle = '#ff4757';
    ctx.beginPath();
    ctx.arc(pinX, pinY, w * 0.018, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(pinX - w * 0.014, pinY + w * 0.01);
    ctx.lineTo(pinX + w * 0.014, pinY + w * 0.01);
    ctx.lineTo(pinX, pinY + w * 0.045);
    ctx.closePath();
    ctx.fill();

    // text
    ctx.fillStyle = '#ffffff';
    ctx.textBaseline = 'top';
    let ty = h - barHeight + pad;
    const tx = pad + w * 0.10;
    for (const l of addressLines) { ctx.fillText(l, tx, ty); ty += lineHeight; }
    ctx.fillStyle = '#e2e2e2';
    for (const l of infoLines) { ctx.fillText(l, tx, ty); ty += lineHeight; }
  }

  // ---------- Capture flow ----------
  captureBtn.addEventListener('click', async () => {
    captureBtn.disabled = true;
    try {
      statusText.textContent = 'Getting your location…';
      const coords = await getLocation();
      const { latitude: lat, longitude: lon, accuracy } = coords;

      statusText.textContent = 'Looking up address…';
      const address = await reverseGeocode(lat, lon);

      // draw the video frame
      const w = video.videoWidth;
      const h = video.videoHeight;
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);

      const timestamp = new Date().toLocaleString();
      drawOverlay(ctx, w, h, { address, lat, lon, accuracy, timestamp });

      const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
      resultImage.src = dataUrl;
      downloadBtn.href = dataUrl;
      downloadBtn.download = `geo_photo_${Date.now()}.jpg`;

      showResult(lat, lon);
    } catch (err) {
      statusText.textContent = 'Could not capture: ' + (err.message || err);
    } finally {
      captureBtn.disabled = false;
    }
  });

  function showResult(lat, lon) {
    resultView.classList.add('active');
    stopCamera();

    // live map preview (for on-screen reference only — not baked into the saved image)
    setTimeout(() => {
      if (!leafletMap) {
        leafletMap = L.map(mapPreviewEl).setView([lat, lon], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors',
          maxZoom: 19
        }).addTo(leafletMap);
        leafletMarker = L.marker([lat, lon]).addTo(leafletMap);
      } else {
        leafletMap.setView([lat, lon], 16);
        leafletMarker.setLatLng([lat, lon]);
      }
      leafletMap.invalidateSize();
    }, 50);
  }

  retakeBtn.addEventListener('click', () => {
    resultView.classList.remove('active');
    statusText.textContent = 'Starting camera…';
    startCamera();
  });

  // ---------- Init ----------
  startCamera();
})();
</script>
</body>
</html>
