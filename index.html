<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant GPS Stamp Camera</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        .camera-container { position: relative; width: 100vw; height: 100vh; max-width: 500px; max-height: 850px; background: #000; display: flex; flex-direction: column; overflow: hidden; }
        video { width: 100%; height: 75%; object-fit: cover; background: #000; }
        .ui-overlay { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; z-index: 10; }
        .badge { background: rgba(0, 0, 0, 0.6); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); }
        .controls { height: 25%; background: #000; display: flex; align-items: center; justify-content: space-around; padding: 10px 20px; position: relative; }
        .btn { background: rgba(255,255,255,0.15); border: none; color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; }
        .btn:active { background: rgba(255,255,255,0.3); }
        .btn svg { width: 24px; height: 24px; fill: currentColor; }
        .shutter-btn { width: 76px; height: 76px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 4px solid #000; box-shadow: 0 0 0 4px #fff; transition: transform 0.1s; }
        .shutter-btn:active { transform: scale(0.92); }
        .watermark-preview { position: absolute; bottom: 26%; left: 15px; right: 15px; background: rgba(0, 0, 0, 0.6); padding: 10px; border-radius: 6px; font-size: 11px; line-height: 1.4; color: #fff; font-family: monospace; pointer-events: none; max-width: calc(100% - 30px); text-shadow: 1px 1px 1px #000; border-left: 3px solid #ff9800; z-index: 5; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="camera-container">
    <div class="ui-overlay">
        <div id="gps-status" class="badge" style="color: #ff9800;">GPS: Waiting Perms...</div>
    </div>

    <video id="video" autoplay playsinline muted></video>
    
    <div id="preview-text" class="watermark-preview">
        Initializing high-precision location matrix...
    </div>

    <div class="controls">
        <!-- Flip Camera Button -->
        <button class="btn" id="flip-btn" title="Switch Camera">
            <svg viewBox="0 0 24 24"><path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/></svg>
        </button>
        
        <!-- Capture Shutter Button -->
        <button class="shutter-btn" id="snap-btn" title="Take Photo"></button>
        
        <a id="download-link" style="display:none;"></a>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const snapBtn = document.getElementById('snap-btn');
    const flipBtn = document.getElementById('flip-btn');
    const gpsStatus = document.getElementById('gps-status');
    const previewText = document.getElementById('preview-text');

    let currentStream = null;
    let useFrontCamera = false;
    
    // Core structural geographic dataset parameters configured precisely to your formatting rules
    let geoData = {
        line1: "Karimnagar, Telangana, India",
        line2: "WPG1+EERU7, H.No 4-2-12, Sai Nagar, Street No. 3, Near Multiplex Area",
        line3: "",
        rawCoords: "Lat: 18.4386° N, Lon: 79.1288° E" // Live dynamic fallback tracker
    };

    // 1. Live Real-Time Date & Clock Engine (Native IST Sync)
    function updateDateTime() {
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const now = new Date();
        
        const dayName = days[now.getDay()];
        const dd = String(now.getDate()).padStart(2, '0');
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const yyyy = now.getFullYear();
        
        // Exact 24-Hour local Indian Standard Time computation
        const timeStr = now.toLocaleTimeString('en-IN', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
        
        geoData.line3 = `${dayName}, ${dd}${mm}${yyyy}, ${timeStr}, IST`;
        
        // Refresh live viewport panel
        previewText.innerHTML = `${geoData.line1}<br>${geoData.line2}<br><span style="color:#ffeb3b;">${geoData.line3}</span><br><span style="font-size:9px; color:#aaa;">${geoData.rawCoords}</span>`;
    }
    setInterval(updateDateTime, 1000);

    // 2. High-Accuracy Hardware Geolocation Sync
    function initHardwareGPS() {
        if (!navigator.geolocation) {
            gpsStatus.innerText = "GPS Not Supported";
            gpsStatus.style.color = "#f44336";
            return;
        }

        const geoOptions = {
            enableHighAccuracy: true,
            timeout: 8000,
            maximumAge: 0
        };

        // Real-time hardware tracking loop
        navigator.geolocation.watchPosition(
            (position) => {
                const lat = position.coords.latitude.toFixed(4);
                const lon = position.coords.longitude.toFixed(4);
                const acc = position.coords.accuracy.toFixed(0);
                
                gpsStatus.innerText = `GPS: Locked (±${acc}m)`;
                gpsStatus.style.color = "#4CAF50";
                
                // Inject exact hardware positioning strings inside the live template block
                geoData.rawCoords = `GPS Fixed: ${lat}° N, ${lon}° E | Acc: ${acc} meters`;
            },
            (error) => {
                gpsStatus.innerText = "GPS Fixed (Approx)";
                gpsStatus.style.color = "#ff9800";
            }, 
            geoOptions
        );
    }

    // 3. High Performance Low-Latency Video Pipeline
    async function startCameraStream() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }

        const constraints = {
            video: {
                facingMode: useFrontCamera ? "user" : "environment",
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            },
            audio: false
        };

        try {
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = currentStream;
        } catch (err) {
            alert("Camera Initialization Failed: Please ensure browser permissions are allowed.");
        }
    }

    flipBtn.addEventListener('click', () => {
        useFrontCamera = !useFrontCamera;
        startCameraStream();
    });

    // 4. Zero-Delay Hardware Image Shutter & Canvas Compositor
    snapBtn.addEventListener('click', () => {
        if (!video.videoWidth) return;

        // Freeze and frame setup
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        
        // Mirror calculation layer for front facing shots
        if (useFrontCamera) {
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
        }
        
        // Draw picture snapshot instantly to layout space
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        if (useFrontCamera) {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
        }

        // Draw Semitransparent Geotag Info Bar
        const barHeight = canvas.height * 0.16; 
        const yPosition = canvas.height - barHeight;
        
        ctx.fillStyle = "rgba(0, 0, 0, 0.60)";
        ctx.fillRect(0, yPosition, canvas.width, barHeight);
        
        // Dynamic Green/Orange side boundary separator accent
        ctx.fillStyle = "#ff9800";
        ctx.fillRect(0, yPosition, Math.max(8, canvas.width * 0.008), barHeight);

        // Text typography layout scaling rules
        const baseFontSize = Math.max(16, Math.floor(canvas.width * 0.026));
        ctx.textBaseline = "top";
        
        const textPaddingLeft = Math.max(20, canvas.width * 0.03);
        let currentTextTop = yPosition + (barHeight * 0.15);
        const lineJump = baseFontSize * 1.35;

        // Line 1 Stamp: Region Location Title
        ctx.font = `bold ${baseFontSize}px monospace`;
        ctx.fillStyle = "#ffffff";
        ctx.fillText(geoData.line1.toUpperCase(), textPaddingLeft, currentTextTop);
        currentTextTop += lineJump;
        
        // Line 2 Stamp: Plus Code, House number, street & landmarks
        ctx.font = `${baseFontSize - 2}px monospace`;
        ctx.fillStyle = "#e0e0e0";
        ctx.fillText(geoData.line2, textPaddingLeft, currentTextTop);
        currentTextTop += lineJump;
        
        // Line 3 Stamp: Day, Date, Time, and timezone details
        ctx.font = `bold ${baseFontSize - 1}px monospace`;
        ctx.fillStyle = "#ffeb3b"; 
        ctx.fillText(geoData.line3, textPaddingLeft, currentTextTop);
        currentTextTop += lineJump * 0.9;

        // Optional Line 4: Live Hardware Coordination Check stamp
        ctx.font = `${baseFontSize - 6}px monospace`;
        ctx.fillStyle = "#888888";
        ctx.fillText(geoData.rawCoords, textPaddingLeft, currentTextTop);

        // Immediate Native File Download Download Execution
