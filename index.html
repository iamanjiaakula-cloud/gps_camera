<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GPS Geo Camera</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
}

.header {
    text-align: center;
    padding: 14px;
}

.header h1 {
    margin: 0;
    font-size: 24px;
}

.header p {
    margin: 5px 0 0;
    color: #aaa;
    font-size: 13px;
}

.camera-box {
    width: 100%;
    max-width: 800px;
    margin: auto;
    background: #000;
}

video {
    width: 100%;
    height: auto;
    min-height: 250px;
    display: block;
    background: #000;
    object-fit: cover;
}

.status {
    text-align: center;
    padding: 10px;
    color: #ddd;
    font-size: 14px;
}

.controls {
    text-align: center;
    padding: 12px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 17px;
    margin: 5px;
    font-size: 15px;
    font-weight: bold;
}

.start {
    background: #2196f3;
    color: white;
}

.gps {
    background: #2e8b57;
    color: white;
}

.switch {
    background: #555;
    color: white;
}

.capture {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: white;
    color: black;
    font-size: 25px;
    border: 5px solid #aaa;
}

.download {
    display: none;
    background: #ff9800;
    color: white;
}

.info {
    max-width: 800px;
    margin: 8px auto;
    padding: 15px;
    background: #202020;
    border-radius: 10px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.info-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.preview {
    max-width: 800px;
    margin: 15px auto;
    padding: 8px;
}

#preview {
    width: 100%;
    display: none;
    border-radius: 8px;
}

canvas {
    display: none;
}

.footer {
    text-align: center;
    color: #888;
    padding: 15px;
    font-size: 12px;
}

</style>

<!-- Plus Code library -->
<script src="https://cdn.jsdelivr.net/npm/@erikmichelson/open-location-code-ts/dist/open-location-code.browser.js"></script>

</head>


<body>


<div class="header">

<h1>📍 GPS Geo Camera</h1>

<p>
Photo • GPS • Address • Plus Code • Date • Time
</p>

</div>


<div class="status" id="status">

Camera not started

</div>


<div class="camera-box">

<video
id="video"
autoplay
muted
playsinline>
</video>

</div>


<div class="controls">


<button
class="start"
onclick="startCamera()">

📷 Start Camera

</button>


<button
class="gps"
onclick="getGPS()">

📍 Get GPS

</button>


<br>


<button
class="switch"
onclick="switchCamera()">

🔄 Switch Camera

</button>


<button
class="capture"
onclick="capturePhoto()">

📷

</button>


<br>


<button
id="downloadBtn"
class="download"
onclick="downloadPhoto()">

⬇️ Save Photo

</button>


</div>


<div
class="info"
id="locationInfo">

<div class="info-title">

📍 GPS Information

</div>

Waiting for GPS...

</div>


<div class="preview">

<img
id="preview"
alt="GPS Photo">

</div>


<canvas id="canvas"></canvas>


<div class="footer">

GPS accuracy depends on your phone,
GPS signal and surroundings.

</div>


<script>


/* ==========================================
   VARIABLES
========================================== */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const preview =
document.getElementById("preview");

const statusText =
document.getElementById("status");

const locationInfo =
document.getElementById("locationInfo");

const downloadBtn =
document.getElementById("downloadBtn");


let stream = null;

let latitude = null;

let longitude = null;

let accuracy = null;

let address = "";

let cityStateCountry = "";

let plusCode = "";

let currentFacing = "environment";

let cameraDevices = [];

let currentDeviceIndex = 0;


/* ==========================================
   START CAMERA
========================================== */

async function startCamera() {

    try {

        statusText.innerText =
        "Starting camera...";


        /* Stop old camera */

        stopCamera();


        /*
        First attempt:
        use requested camera direction.
        */

        try {

            stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: currentFacing
                    },

                    width: {
                        ideal: 1920
                    },

                    height: {
                        ideal: 1080
                    }

                },

                audio: false

            });

        }

        catch (firstError) {

            /*
            Fallback camera
            */

            stream =
            await navigator.mediaDevices.getUserMedia({

                video: true,

                audio: false

            });

        }


        video.srcObject =
        stream;


        /*
        Make sure video actually starts.
        */

        await new Promise(function(resolve) {

            if (video.readyState >= 2) {

                resolve();

            }

            else {

                video.onloadedmetadata =
                function() {

                    resolve();

                };

            }

        });


        try {

            await video.play();

        }

        catch (playError) {

            console.log(playError);

        }


        /*
        Get camera list after permission.
        */

        await loadCameraDevices();


        statusText.innerText =
        "✅ Camera is ready";


    }

    catch (error) {

        console.error(error);

        statusText.innerText =
        "❌ Camera Error: " +
        error.message;

        alert(
        "Camera could not start.\n\n" +
        error.message
        );

    }

}


/* ==========================================
   STOP CAMERA
========================================== */

function stopCamera() {

    if (stream) {

        stream
        .getTracks()
        .forEach(function(track) {

            track.stop();

        });

        stream = null;

    }

}


/* ==========================================
   LOAD CAMERA DEVICES
========================================== */

async function loadCameraDevices() {

    try {

        const devices =
        await navigator.mediaDevices.enumerateDevices();


        cameraDevices =
        devices.filter(function(device) {

            return device.kind ===
            "videoinput";

        });


    }

    catch (error) {

        console.log(
        "Could not list cameras",
        error
        );

    }

}


/* ==========================================
   SWITCH CAMERA
========================================== */

async function switchCamera() {

    if (!stream) {

        alert(
        "Start the camera first."
        );

        return;

    }


    /*
    Change requested direction.
    */

    if (
        currentFacing ===
        "environment"
    ) {

        currentFacing = "user";

    }

    else {

        currentFacing = "environment";

    }


    statusText.innerText =
    "Switching camera...";


    try {

        /*
        Try exact camera direction.
        */

        stopCamera();


        stream =
        await navigator.mediaDevices.getUserMedia({

            video: {

                facingMode: {
                    exact: currentFacing
                },

                width: {
                    ideal: 1920
                },

                height: {
                    ideal: 1080
                }

            },

            audio: false

        });


        video.srcObject =
        stream;


        await video.play();


        statusText.innerText =
        "✅ Camera switched";


    }

    catch (error) {

        console.log(
        "Exact camera switch failed",
        error
        );


        /*
        Fallback:
        try normal camera.
        */

        try {

            stream =
            await navigator.mediaDevices.getUserMedia({

                video: true,

                audio: false

            });


            video.srcObject =
            stream;


            await video.play();


            statusText.innerText =
            "✅ Camera ready";


        }

        catch (secondError) {

            statusText.innerText =
            "❌ Could not switch camera";

            alert(
            "Could not switch camera.\n\n" +
            secondError.message
            );

        }

    }

}


/* ==========================================
   GET GPS
========================================== */

function getGPS() {


    if (!navigator.geolocation) {

        alert(
        "GPS is not supported by this browser."
        );

        return;

    }


    locationInfo.innerHTML =

    "<div class='info-title'>" +
    "📍 Getting GPS..." +
    "</div>" +

    "Please wait...";


    navigator.geolocation.getCurrentPosition(

        async function(position) {


            latitude =
            position.coords.latitude;


            longitude =
            position.coords.longitude;


            accuracy =
            position.coords.accuracy;


            locationInfo.innerHTML =

            "<div class='info-title'>" +
            "📍 GPS Found" +
            "</div>" +

            "Latitude: " +
            latitude.toFixed(6) +

            "<br>" +

            "Longitude: " +
            longitude.toFixed(6) +

            "<br>" +

            "Accuracy: ±" +
            Math.round(accuracy) +
            " meters" +

            "<br><br>" +

            "🏠 Getting address...";


            /*
            Generate Plus Code
            */

            generatePlusCode();


            /*
            Reverse geocode
            */

            await getAddress();


        },


        function(error) {


            let message =
            "GPS error";


            if (error.code === 1) {

                message =
                "Location permission denied.";

            }

            else if (error.code === 2) {

                message =
                "Location unavailable.";

            }

            else if (error.code === 3) {

                message =
                "GPS request timed out.";

            }


            locationInfo.innerHTML =

            "<div class='info-title'>" +
            "❌ GPS Error" +
            "</div>" +

            message;

        },


        {

            enableHighAccuracy: true,

            timeout: 20000,

            maximumAge: 0

        }

    );

}


/* ==========================================
   GENERATE PLUS CODE
========================================== */

function generatePlusCode() {

    try {

        /*
        Normal Plus Code precision.
        */

        plusCode =
        OpenLocationCode.encode(
            latitude,
            longitude,
            10
        );


        console.log(
        "Plus Code:",
        plusCode
        );

    }

    catch (error) {

        console.error(
        "Plus Code error",
        error
        );

        plusCode =
        "Unavailable";

    }

}


/* ==========================================
   GET ADDRESS
========================================== */

async function getAddress() {


    try {


        const url =

        "https://nominatim.openstreetmap.org/reverse" +

        "?format=json" +

        "&lat=" +
        encodeURIComponent(latitude) +

        "&lon=" +
        encodeURIComponent(longitude) +

        "&zoom=18" +

        "&addressdetails=1";


        const response =
        await fetch(url, {

            headers: {

                "Accept":
                "application/json"

            }

        });


        if (!response.ok) {

            throw new Error(
            "Address service unavailable"
            );

        }


        const data =
        await response.json();


        address =
        data.display_name ||
        "Address unavailable";


        /*
        Create a clean
        city/state/country line.
        */

        const a =
        data.address || {};


        const city =
        a.city ||
        a.town ||
        a.village ||
        a.municipality ||
        a.county ||
        "Karimnagar";


        const state =
        a.state ||
        "Telangana";


        const country =
        a.country ||
        "India";


        cityStateCountry =

        city +
        ", " +
        state +
        ", " +
        country;


        /*
        Show information.
        */

        locationInfo.innerHTML =

        "<div class='info-title'>" +
        "📍 GPS Location Found" +
        "</div>" +

        "<b>" +
        cityStateCountry +
        "</b>" +

        "<br><br>" +

        "<b>Plus Code:</b><br>" +

        plusCode +

        "<br><br>" +

        "<b>Address:</b><br>" +

        address +

        "<br><br>" +

        "Lat: " +
        latitude.toFixed(6) +

        "<br>" +

        "Lon: " +
        longitude.toFixed(6) +

        "<br>" +

        "Accuracy: ±" +
        Math.round(accuracy) +
        " meters";


    }

    catch (error) {


        console.error(error);


        address =
        "Address unavailable";


        cityStateCountry =
        "Karimnagar, Telangana, India";


        locationInfo.innerHTML =

        "<div class='info-title'>" +
        "📍 GPS Location Found" +
        "</div>" +

        cityStateCountry +

        "<br><br>" +

        "Plus Code: " +
        plusCode +

        "<br><br>" +

        "Address unavailable" +

        "<br><br>" +

        "Lat: " +
        latitude.toFixed(6) +

        "<br>" +

        "Lon: " +
        longitude.toFixed(6);

    }

}


/* ==========================================
   WRAP TEXT
========================================== */

function drawWrappedText(
    ctx,
    text,
    x,
    y,
    maxWidth,
    lineHeight,
    maxLines
) {


    const words =
    String(text).split(/\s+/);


    let line = "";

    let lines = [];


    for (
        let i = 0;
        i < words.length;
        i++
    ) {


        const testLine =

        line === ""

        ? words[i]

        : line +
        " " +
        words[i];


        const width =
        ctx.measureText(
            testLine
        ).width;


        if (
            width > maxWidth &&
            line !== ""
        ) {


            lines.push(line);

            line =
            words[i];


        }

        else {

            line =
            testLine;

        }

    }


    if (line !== "") {

        lines.push(line);

    }


    if (
        lines.length >
        maxLines
    ) {

        lines =
        lines.slice(
            0,
            maxLines
        );


        lines[maxLines - 1] +=
        "...";

    }


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        ctx.fillText(
            lines[i],
            x,
            y +
            i * lineHeight
        );

    }


    return lines.length;

}


/* ==========================================
   DATE & TIME
========================================== */

function getISTDateTime() {


    const now =
    new Date();


    const parts =
    new Intl.DateTimeFormat(
        "en-IN",
        {

            timeZone:
            "Asia/Kolkata",

            weekday:
            "long",

            day:
            "2-digit",

            month:
            "2-digit",

            year:
            "numeric",

            hour:
            "2-digit",

            minute:
            "2-digit",

            second:
            "2-digit",

            hour12:
            false

        }
    ).formatToParts(now);


    let values = {};


    parts.forEach(
    function(part) {

        values[part.type] =
        part.value;

    });


    return {

        weekday:
        values.weekday,

        date:
        values.day +
        "/" +
        values.month +
        "/" +
        values.year,

        time:
        values.hour +
        ":" +
        values.minute +
        ":" +
        values.second

    };

}


/* ==========================================
   CAPTURE PHOTO
========================================== */

function capturePhoto() {


    if (!stream) {

        alert(
        "Please start the camera first."
        );

        return;

    }


    if (
        latitude === null ||
        longitude === null
    ) {

        alert(
        "Please tap Get GPS first."
        );

        return;

    }


    if (
        video.videoWidth === 0 ||
        video.videoHeight === 0
    ) {

        alert(
        "Camera is not ready."
        );

        return;

    }


    /*
    Canvas uses actual camera
    resolution.
    */

    canvas.width =
    video.videoWidth;

    canvas.height =
    video.videoHeight;


    const ctx =
    canvas.getContext("2d");


    /*
    Draw photo.
    */

    ctx.drawImage(

        video,

        0,

        0,

        canvas.width,

        canvas.height

    );


    /* ======================================
       DATE / TIME
    ====================================== */

    const dt =
    getISTDateTime();


    /* ======================================
       PANEL
    ====================================== */

    const panelHeight =
    300;


    const panelY =
    canvas.height -
    panelHeight;


    ctx.fillStyle =
    "rgba(0,0,0,0.82)";


    ctx.fillRect(

        0,

        panelY,

        canvas.width,

        panelHeight

    );


    /*
    White vertical line.
    */

    ctx.fillStyle =
    "white";


    ctx.fillRect(

        15,

        panelY + 15,

        5,

        panelHeight - 30

    );


    const x = 38;


    /* ======================================
       CITY
    ====================================== */

    ctx.font =
    "bold 22px Arial";


    ctx.fillText(

        cityStateCountry,

        x,

        panelY + 38

    );


    /* ======================================
       PLUS CODE + ADDRESS
    ====================================== */

    ctx.font =
    "bold 17px Arial";


    ctx.fillText(

        plusCode,

        x,

        panelY + 68

    );


    ctx.font =
    "16px Arial";


    drawWrappedText(

        ctx,

        address,

        x,

        panelY + 94,

        canvas.width - 65,

        21,

        3

    );


    /* ======================================
       LAT LON
    ====================================== */

    ctx.font =
    "bold 17px Arial";


    ctx.fillText(

        "Lat: " +
        latitude.toFixed(6),

        x,

        panelY + 166

    );


    ctx.fillText(

        "Lon: " +
        longitude.toFixed(6),

        x,

        panelY + 193

    );


    /* ======================================
       ACCURACY
    ====================================== */

    ctx.font =
    "15px Arial";


    ctx.fillText(

        "Accuracy: ±" +
        Math.round(accuracy) +
        " meters",

        x,

        panelY + 218

    );


    /* ======================================
       DATE TIME
    ====================================== */

    ctx.font =
    "bold 16px Arial";


    ctx.fillText(

        dt.weekday +
        " " +
        dt.date +
        " " +
        dt.time +
        " IST +5:30",

        x,

        panelY + 250

    );


    /* ======================================
       CREATE JPG
    ====================================== */

    const image =
    canvas.toDataURL(

        "image/jpeg",

        0.93

    );


    preview.src =
    image;


    preview.style.display =
    "block";


    downloadBtn.style.display =
    "inline-block";


    preview.scrollIntoView({

        behavior:
        "smooth"

    });

}


/* ==========================================
   DOWNLOAD
========================================== */

function downloadPhoto() {


    if (
        !canvas.width
    ) {

        alert(
        "Capture a photo first."
        );

        return;

    }


    const dt =
    getISTDateTime();


    const filename =

    "GPS_Photo_" +

    dt.date.replace(
        /\//g,
        "-"
    ) +

    "_" +

    dt.time.replace(
        /:/g,
        "-"
    ) +

    ".jpg";


    const link =
    document.createElement("a");


    link.download =
    filename;


    link.href =
    canvas.toDataURL(
        "image/jpeg",
        0.93
    );


    document.body.appendChild(
    link
    );


    link.click();


    document.body.removeChild(
    link
    );

}


</script>

</body>
      </html>
