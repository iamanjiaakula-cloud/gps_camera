<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GPS Geo Camera</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --bar-bg: rgba(0,0,0,0.65);
    --accent: #2dd4bf;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; background:#000; color:#fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #app { position: relative; width: 100vw; height: 100vh; }

  #video, #resultView, #canvas {
    position: absolute; top:0; left:0; width:100%; height:100%;
    object-fit: cover;
  }
  #video { background:#111; }
  #canvas { display:none; }

  #topBar {
    position: absolute; top:0; left:0; right:0;
    padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    background: linear-gradient(rgba(0,0,0,0.55), transparent);
    font-size: 14px; text-align:center; z-index: 5;
    pointer-events:none;
  }

  #controls {
    position:absolute; left:0; right:0; bottom: max(24px, env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:center; gap:40px;
    z-index: 5;
  }
  #captureBtn {
    width:72px; height:72px; border-radius:50%; border:4px solid #fff;
    background: rgba(255,255,255,0.15); cursor:pointer;
  }
  #captureBtn:active { background: rgba(255,255,255,0.4); }
  #switchBtn, #retakeBtn, #downloadBtn {
    background: rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.5);
    color:#fff; border-radius: 10px; padding: 10px 16px; font-size:15px;
    cursor:pointer; text-decoration:none; display:inline-block;
  }
  #switchBtn { width:52px; height:52px; border-radius:50%; font-size:22px; padding:0; }

  #resultView {
    display:none; flex-direction: column; background:#000; overflow-y:auto;
    z-index: 10;
  }
  #resultView.active { display:flex; }
  #resultImage { width:100%; display:block; }
  #mapPreview { width:100%; height: 180px; background:#222; }
  #resultControls {
    display:flex; gap:16px; justify-content:center; padding: 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
  }

  #statusText { display:block; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="app">

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="topBar"><span id="statusText">Starting camera…</span></div>

  <div id="controls">
    <button id="switchBtn" title="Switch camera">🔄</button>
    <button id="captureBtn" title="Capture"></button>
    <div style="width:52px"></div>
  </div>

  <div id="resultView">
    <img id="resultImage" alt="Captured geo-tagged photo" />
    <div id="mapPreview"></div>
    <div id="resultControls">
      <button id="retakeBtn">Retake</button>
      <a id="downloadBtn" download="geo_photo.jpg">Download</a>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const statusText = document.getElementById('statusText');
  const captureBtn = document.getElementById('captureBtn');
  const switchBtn = document.getElementById('switchBtn');
  const resultView = document.getElementById('resultView');
  const resultImage = document.getElementById('resultImage');
  const retakeBtn = document.getElementById('retakeBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const mapPreviewEl = document.getElementById('mapPreview');

  let currentStream = null;
  let facingMode = 'environment'; // back camera by default
  let leafletMap = null;
  let leafletMarker = null;

  // ---------- Camera handling ----------
  async function startCamera() {
    stopCamera();
    try {
      currentStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facingMode } },
        audio: false
      });
      video.srcObject = currentStream;
      statusText.textContent = 'Ready — tap the shutter to capture';
    } catch (err) {
      statusText.textContent = 'Camera access denied or unavailable: ' + err.message;
    }
  }

  function stopCamera() {
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
      currentStream = null;
    }
  }

  switchBtn.addEventListener('click', () => {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    startCamera();
  });

  // ---------- Geolocation ----------
  function getLocation() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(new Error('Geolocation not supported by this browser'));
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => resolve(pos.coords),
        err => reject(err),
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );
    });
  }

  // Converts a 2-letter ISO country code (e.g. "IN") into its flag emoji.
  function countryCodeToFlag(cc) {
    if (!cc || cc.length !== 2) return '';
    return cc.toUpperCase().replace(/./g, ch => String.fromCodePoint(127397 + ch.charCodeAt(0)));
  }

  // Reverse-geocode via OpenStreetMap Nominatim (free, rate-limited — fine for personal use).
  // Returns a short bold "header" (city, state, country) and a fuller "detail" address line,
  // similar to how commercial GPS-camera apps split the address into two lines.
  async function reverseGeocode(lat, lon) {
    try {
      const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`;
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) throw new Error('Lookup failed');
      const data = await res.json();
      const a = data.address || {};
      const city = a.city || a.town || a.village || a.suburb || a.county || '';
      const header = [city, a.state, a.country].filter(Boolean).join(', ') || 'Unknown location';
      const flag = countryCodeToFlag(a.country_code);
      return { header, detail: data.display_name || '', flag };
    } catch (e) {
      return { header: 'Unknown location', detail: 'Address unavailable', flag: '' };
    }
  }

  // ---------- Drawing the geotag overlay onto the captured photo ----------
  function wrapText(ctx, text, maxWidth) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const word of words) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  // Converts lat/lon to fractional slippy-map tile coordinates at a given zoom.
  function lonLatToTileFloat(lat, lon, zoom) {
    const n = Math.pow(2, zoom);
    const x = (lon + 180) / 360 * n;
    const latRad = lat * Math.PI / 180;
    const y = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
    return { x, y, n };
  }

  function withTimeout(promise, ms) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error('timeout')), ms);
      promise.then(v => { clearTimeout(timer); resolve(v); },
                   e => { clearTimeout(timer); reject(e); });
    });
  }

  function loadImage(url, timeoutMs) {
    return withTimeout(new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('tile failed to load'));
      img.src = url;
    }), timeoutMs);
  }

  // Draws a clear red map pin (circle head + point + drop shadow) centered
  // in a size x size square. Used on both the real map and the fallback map,
  // so a pin always looks the same regardless of which one is used.
  function drawPin(ctx, size) {
    const cx = size / 2;
    const headCy = size * 0.38;
    const headR = size * 0.16;
    const tipY = size * 0.72;

    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(cx, tipY + size * 0.03, size * 0.09, size * 0.03, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ea4335';
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = Math.max(1, size * 0.008);
    ctx.beginPath();
    ctx.arc(cx, headCy, headR, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx - headR * 0.75, headCy + headR * 0.6);
    ctx.lineTo(cx + headR * 0.75, headCy + headR * 0.6);
    ctx.lineTo(cx, tipY);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(cx, headCy, headR * 0.42, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // A simple, always-available stylized "map" (pale background, a couple of
  // road lines, a soft water/park block) so there's still a map-like image
  // with a pin even when real map tiles can't be fetched (offline, blocked,
  // slow connection, etc).
  function createStylizedMapCanvas(size) {
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const ctx = c.getContext('2d');

    ctx.fillStyle = '#eef1e6';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#cfe3ec';
    ctx.fillRect(0, size * 0.62, size * 0.4, size * 0.38);
    ctx.fillStyle = '#d9ead0';
    ctx.fillRect(size * 0.68, 0, size * 0.32, size * 0.35);

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = Math.max(2, size * 0.02);
    [0.3, 0.62].forEach(f => { ctx.beginPath(); ctx.moveTo(0, size * f); ctx.lineTo(size, size * f); ctx.stroke(); });
    [0.35, 0.7].forEach(f => { ctx.beginPath(); ctx.moveTo(size * f, 0); ctx.lineTo(size * f, size); ctx.stroke(); });

    drawPin(ctx, size);
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, size - 2, size - 2);
    return c;
  }

  // Fetches the OpenStreetMap tiles needed to cover a size x size window
  // centered on lat/lon. Rejects (rather than leaving gaps) if any tile
  // fails or times out, so the caller can cleanly fall back instead of
  // showing a half-broken grid.
  async function buildRealTileCanvas(lat, lon, size, zoom) {
    const { x: xtileF, y: ytileF, n } = lonLatToTileFloat(lat, lon, zoom);
    const centerPxX = xtileF * 256;
    const centerPxY = ytileF * 256;
    const minPxX = centerPxX - size / 2;
    const minPxY = centerPxY - size / 2;
    const minTileX = Math.floor(minPxX / 256);
    const maxTileX = Math.floor((centerPxX + size / 2) / 256);
    const minTileY = Math.floor(minPxY / 256);
    const maxTileY = Math.floor((centerPxY + size / 2) / 256);

    const gridCanvas = document.createElement('canvas');
    gridCanvas.width = (maxTileX - minTileX + 1) * 256;
    gridCanvas.height = (maxTileY - minTileY + 1) * 256;
    const gctx = gridCanvas.getContext('2d');

    const loads = [];
    for (let tx = minTileX; tx <= maxTileX; tx++) {
      for (let ty = minTileY; ty <= maxTileY; ty++) {
        const wrappedX = ((tx % n) + n) % n;
        const url = `https://tile.openstreetmap.org/${zoom}/${wrappedX}/${ty}.png`;
        loads.push(loadImage(url, 3000).then(img => {
          gctx.drawImage(img, (tx - minTileX) * 256, (ty - minTileY) * 256);
        }));
      }
    }
    await Promise.all(loads);

    const outCanvas = document.createElement('canvas');
    outCanvas.width = size; outCanvas.height = size;
    outCanvas.getContext('2d').drawImage(
      gridCanvas,
      minPxX - minTileX * 256, minPxY - minTileY * 256, size, size,
      0, 0, size, size
    );
    return outCanvas;
  }

  // Builds the map thumbnail baked into the photo. Tries real OpenStreetMap
  // tiles first; if that fails or is too slow, falls back to the stylized
  // map above — either way this always resolves with a valid canvas that
  // already has the pin drawn on it, so the photo never ends up without one.
  async function buildMapThumbnail(lat, lon, size, zoom = 16) {
    try {
      const real = await withTimeout(buildRealTileCanvas(lat, lon, size, zoom), 5000);
      const ctx = real.getContext('2d');
      drawPin(ctx, size);
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = Math.max(2, size * 0.012);
      ctx.strokeRect(1, 1, size - 2, size - 2);
      return real;
    } catch (e) {
      return createStylizedMapCanvas(size);
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function formatTimestamp(d) {
    const dayName = d.toLocaleDateString(undefined, { weekday: 'long' });
    const dateStr = d.toLocaleDateString(undefined, { day: '2-digit', month: '2-digit', year: 'numeric' });
    const timeStr = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: true });
    const offsetMin = -d.getTimezoneOffset();
    const sign = offsetMin >= 0 ? '+' : '-';
    const abs = Math.abs(offsetMin);
    const hh = String(Math.floor(abs / 60)).padStart(2, '0');
    const mm = String(abs % 60).padStart(2, '0');
    return `${dayName}, ${dateStr} ${timeStr} GMT ${sign}${hh}:${mm}`;
  }

  function drawOverlay(ctx, w, h, { header, detail, flag, lat, lon, accuracy, timestamp, mapThumb, thumbSize }) {
    const pad = Math.round(w * 0.03);
    const textAreaWidth = w - pad * 2 - thumbSize - pad;

    const headerFontSize = Math.round(w * 0.038);
    const bodyFontSize = Math.round(w * 0.028);
    const lineHeight = Math.round(bodyFontSize * 1.5);
    const headerLineHeight = Math.round(headerFontSize * 1.4);

    ctx.font = `${bodyFontSize}px sans-serif`;
    const detailLines = wrapText(ctx, detail, textAreaWidth).slice(0, 3);
    const infoLines = [
      `Lat ${lat.toFixed(6)}°  Long ${lon.toFixed(6)}°  (±${Math.round(accuracy)}m)`,
      timestamp
    ];

    const textBlockHeight = headerLineHeight + (detailLines.length + infoLines.length) * lineHeight;
    const barHeight = Math.max(pad * 2 + textBlockHeight, thumbSize + pad * 2);

    // semi-transparent bar
    ctx.fillStyle = 'rgba(0,0,0,0.62)';
    ctx.fillRect(0, h - barHeight, w, barHeight);

    // map thumbnail, bottom-left (always present — see buildMapThumbnail)
    const thumbY = h - barHeight + (barHeight - thumbSize) / 2;
    ctx.drawImage(mapThumb, pad, thumbY, thumbSize, thumbSize);

    // small app badge just above the bar, right-aligned
    const badgeText = '📍 GPS Geo Camera';
    ctx.font = `${Math.round(w * 0.024)}px sans-serif`;
    const badgePadX = Math.round(w * 0.015);
    const badgeW = ctx.measureText(badgeText).width + badgePadX * 2;
    const badgeH = Math.round(w * 0.038);
    const badgeX = w - pad - badgeW;
    const badgeY = h - barHeight - badgeH - Math.round(w * 0.01);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    roundRect(ctx, badgeX, badgeY, badgeW, badgeH, badgeH / 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.textBaseline = 'middle';
    ctx.fillText(badgeText, badgeX + badgePadX, badgeY + badgeH / 2);

    // text content, to the right of the thumbnail
    const tx = pad + thumbSize + pad;
    let ty = h - barHeight + pad;

    ctx.textBaseline = 'top';
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${headerFontSize}px sans-serif`;
    ctx.fillText(`${header} ${flag}`.trim(), tx, ty);
    ty += headerLineHeight;

    ctx.font = `${bodyFontSize}px sans-serif`;
    ctx.fillStyle = '#e2e2e2';
    for (const l of detailLines) { ctx.fillText(l, tx, ty); ty += lineHeight; }

    ctx.fillStyle = '#ffffff';
    for (const l of infoLines) { ctx.fillText(l, tx, ty); ty += lineHeight; }
  }

  // ---------- Capture flow ----------
  captureBtn.addEventListener('click', async () => {
    captureBtn.disabled = true;
    try {
      statusText.textContent = 'Getting your location…';
      const coords = await getLocation();
      const { latitude: lat, longitude: lon, accuracy } = coords;

      statusText.textContent = 'Looking up address & building map…';
      const w = video.videoWidth;
      const h = video.videoHeight;
      const thumbSize = Math.round(w * 0.17);

      const [address, mapThumb] = await Promise.all([
        reverseGeocode(lat, lon),
        buildMapThumbnail(lat, lon, thumbSize) // always resolves — real tiles, or a stylized fallback with a pin
      ]);

      // draw the video frame
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);

      const timestamp = formatTimestamp(new Date());
      drawOverlay(ctx, w, h, {
        header: address.header, detail: address.detail, flag: address.flag,
        lat, lon, accuracy, timestamp, mapThumb, thumbSize
      });

      const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
      resultImage.src = dataUrl;
      downloadBtn.href = dataUrl;
      downloadBtn.download = `geo_photo_${Date.now()}.jpg`;

      showResult(lat, lon);
    } catch (err) {
      statusText.textContent = 'Could not capture: ' + (err.message || err);
    } finally {
      captureBtn.disabled = false;
    }
  });

  function showResult(lat, lon) {
    resultView.classList.add('active');
    stopCamera();

    // live map preview (for on-screen reference only — not baked into the saved image)
    setTimeout(() => {
      if (!leafletMap) {
        leafletMap = L.map(mapPreviewEl).setView([lat, lon], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors',
          maxZoom: 19
        }).addTo(leafletMap);
        leafletMarker = L.marker([lat, lon]).addTo(leafletMap);
      } else {
        leafletMap.setView([lat, lon], 16);
        leafletMarker.setLatLng([lat, lon]);
      }
      leafletMap.invalidateSize();
    }, 50);
  }

  retakeBtn.addEventListener('click', () => {
    resultView.classList.remove('active');
    statusText.textContent = 'Starting camera…';
    startCamera();
  });

  // ---------- Init ----------
  startCamera();
})();
</script>
</body>
</html>
